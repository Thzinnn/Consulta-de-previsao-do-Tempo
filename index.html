<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Previsão do tempo</title>
</head>

<body>
    <header>
        <h1>Previsão do tempo</h1>
    </header>

    <main>
        <form class="informe-cidade">
            <span id="texto-cidade">Digite o nome da Cidade</span>
            <input type="text" id="nome-cidade" />
            <button id="enviar-cidade" type="submit">Enviar</button>
        </form>
        <div id="previsao" class="previsao">
            <div id="previsao-Atual" class="previsao-Atual">
                <header>
                    <span id="cidade" class="cidade">Nome da Cidade</span>
                </header>
                <main>
                    <div id="lado-esquerdo" class="lado-esquerdo">
                        <div id="horario" class="horario">
                            <span class="descricao-texto">Horario:</span>
                            <span class="horario-dados">15:00</span>
                        </div>
                        <div id="div-dia" class="div-dia">
                            <span class="dia">☀️</span>
                        </div>
                        <div id="umidade" class="umidade">
                            <span class="descricao-texto">Umidade:</span>
                            <span class="umidade-dados">15%</span>
                        </div>
                    </div>
                    <div id="meio" class="meio">
                        <div id="div-temperatura" class="div-temperatura">
                            <span id="temperatura" class="temperatura">29°</span>
                        </div>
                        <div id="div-sensacao" class="div-sensacao">
                            <span id="descricao-sensacao" class="descricao-sensacao">Sensação Térmica</span>
                            <span id="sensacao" class="sensacao">34°</span>
                        </div>
                    </div>
                    <div id="lado-direito" class="lado-direito">
                        <div id="div-preciptacao" class="div-preciptacao">
                            <span id="descricao-preciptacao" class="descricao-preciptacao">Chuva:</span>   
                            <span id="preciptacao" class="preciptacao">55mm</span>                                  
                        </div>
                        <div id="div-nuvens" class="div-nuvens">
                            <span id="descricao-nuvens" class="descricao-nuvens">Nuvens:</span>       
                            <span id="nuvens" class="nuvens">40%</span>       
                        </div>
                    </div>
                </main>
            </div>
            <div id="previsao-Horas" class="previsao-Horas"></div>
        </div>
    </main>

    <footer></footer>

    <script src="/js/script.js"></script>
</body>

</html>
